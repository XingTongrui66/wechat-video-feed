name: Update official feed

# 公众号 / 看一看 / AI 评论的云端抓取任务。
# 跑在 GitHub 服务器（Node + 无跨域限制 + cron 定时器），产出提交回本仓库，
# 由 GitHub Pages 直接对外提供 → APK 无需重新打包即可吃到最新数据。
on:
  schedule:
    # 每 2 小时跑一次，保证"有标题就有正文"不变式最多 2 小时闭环一次。
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 与本仓库其它 feed 任务共用一把锁，避免两条同时 push main 撞 non-fast-forward。
# cancel-in-progress: true → 新触发直接抢占正在跑的旧 run（旧的最多 15 分钟超时放行，不会无限排队）。
concurrency:
  group: shared-git-lock
  cancel-in-progress: true

jobs:
  update-official:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # content library 是持续累积池（本地已 75MB 且每轮都会变），
      # 提交进 git 会让仓库迅速膨胀 → 改用 Actions 缓存跨轮保留。
      # 缓存未命中时脚本会优雅降级为空池，不影响抓取結果。
      - name: Restore content library cache
        uses: actions/cache@v4
        with:
          path: data/library.json
          key: official-library-${{ github.run_id }}
          restore-keys: |
            official-library-

      - name: Generate official + look feed
        run: node scripts/update-official-feed.js

      # AI 评论：增量生成（已有评论的文章会跳过）。
      # 去掉 continue-on-error：生成失败/0 条/402/没 key 时直接让 CI 标 failure，
      # 避免"假 success 但 key 数不涨"的坑。
      - name: Generate AI comments (incremental)
        env:
          SF_KEY: ${{ secrets.SF_KEY }}
        run: node scripts/ai-comments.js --conc 4

      # 剥离正文为单篇小文件 data/articles/{id}.json（幂等）：
      # 保证 official-feed.json 里每一篇有标题的文章，都配一个可独立拉取的正文章节。
      - name: Strip article bodies into per-id files
        run: python3 scripts/strip-content-to-articles.py

      # 审计：检查 official-feed 里是否存在"有标题但缺单篇"的文章（不应发生，仅记录）。
      - name: Audit per-article body coverage
        run: |
          python3 - <<'PY'
          import json,os
          feed=json.load(open('data/official-feed.json',encoding='utf-8'))
          art='data/articles'
          missing=[]
          for a in (feed.get('accounts') or []):
              for it in (a.get('articles') or []):
                  cid=it.get('id')
                  if cid and not os.path.exists(os.path.join(art,f'{cid}.json')):
                      missing.append(str(cid))
          open('data/articles-missing.txt','w').write('\n'.join(missing))
          print('official-feed articles:',sum(len(a.get('articles') or []) for a in (feed.get('accounts') or [])))
          print('missing per-id bodies:',len(missing))
          if missing: print('first 20:',missing[:20])
          PY

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update official/look feed + AI comments + per-id article bodies'
          file_pattern: >-
            data/official-feed.json
            data/look-feed.json
            data/ai-review.json
            data/articles-history.json
            data/articles-missing.txt
            data/articles/

      # 上传单篇到腾讯 COS：手机端 vwFetchJson 远程优先读 COS，
      # 这里必须把 data/articles/{id}.json 推上去，"有标题就有正文"才成立。
      # 增量上传：只传本轮 git diff 里新增/变更的单篇（+ 4 个 feed JSON 全量），
      # 不再遍历整个 data/articles/ 目录（1700+ 篇逐个 PUT 会超时），避免 15 分钟跑不完。
      # 用纯标准库实现（hmac/hashlib/urllib），不依赖任何第三方包，避免 CI 装包失败。
      - name: Upload per-id article bodies to Tencent COS
        if: success()
        timeout-minutes: 15
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: vw-data-1311399697
          COS_REGION: ap-guangzhou
        run: |
          # 本轮 git diff 里新增/变更的单篇（相对上一轮 main，只传变更部分）
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'data/articles/' || true)
          if [ -z "$CHANGED" ]; then
            # 兜底：若 diff 为空（首轮/无变更），回退到全量
            CHANGED=$(ls data/articles/ 2>/dev/null || true)
          fi
          export CHANGED
          python3 - <<'PY'
          import os, time, hmac, hashlib, urllib.request, urllib.error
          SID=os.environ.get('COS_SECRET_ID',''); SKEY=os.environ.get('COS_SECRET_KEY','')
          BUCKET=os.environ.get('COS_BUCKET','vw-data-1311399697'); REGION=os.environ.get('COS_REGION','ap-guangzhou')
          HOST=f'{BUCKET}.cos.{REGION}.myqcloud.com'
          if not SID or not SKEY:
              print('COS_SECRET_ID / COS_SECRET_KEY not set, skip COS upload'); raise SystemExit(0)
          def h(k,m): return hmac.new(k, m.encode('utf-8'), hashlib.sha256).digest()
          def put(key, body, ct='application/json; charset=utf-8'):
              t0=int(time.time()); kt=f'{t0};{t0+3000}'; dp=time.strftime('%Y-%m-%d', time.gmtime(t0))
              md5=hashlib.md5(body).hexdigest()
              canon='PUT/'+key+'/'+chr(10)+f'content-type:{ct};host:{HOST};'+chr(10)+'content-type;host'+chr(10)+md5
              sts='TC3-HMAC-SHA256'+chr(10)+kt+chr(10)+'/cos/'+dp+'/qcs'+chr(10)+hashlib.sha256(canon.encode()).hexdigest()
              k=h(SKEY.encode(),dp); k=h(k,'cos'); k=h(k,REGION); k=h(k,'qcs')
              sig=hmac.new(k,sts.encode(),hashlib.sha256).hexdigest()
              auth=f'TC3-HMAC-SHA256 Credential={SID}/{kt}/cos/{dp}/qcs, SignedHeaders=content-type;host, Signature={sig}'
              req=urllib.request.Request(f'https://{HOST}/{key}', data=body, method='PUT')
              req.add_header('Content-Type', ct); req.add_header('Host', HOST)
              req.add_header('X-TC-Action','PutObject'); req.add_header('X-TC-Timestamp',str(t0)); req.add_header('Authorization',auth)
              proxy=urllib.request.build_opener(urllib.request.ProxyHandler({}))
              for a in range(4):
                  try:
                      r=proxy.open(req, timeout=180); return r.status, ''
                  except urllib.error.HTTPError as e:
                      return e.code, e.read().decode('utf-8','replace')[:200]
                  except Exception as e:
                      if a==3: return -1, str(e)[:200]
                      time.sleep(2)
              return -1, 'retry-exhausted'
          # 增量：只传 CHANGED 列出的文件（git diff 输出的本地相对路径）
          changed = os.environ.get('CHANGED','').split()
          changed = [c for c in changed if c.endswith('.json')]
          up=0; fail=0
          for rel in changed:
              local = rel
              if not os.path.exists(local): continue
              st, info = put(rel, open(local,'rb').read())
              if st==200: up+=1
              else:
                  fail+=1
                  if fail<5: print('put fail', rel, info[:150])
          print(f'COS incremental upload: {len(changed)} changed, ok={up} fail={fail}')
          if fail and fail>up:
              raise SystemExit('too many COS upload failures')
          PY

      # 同样纯标准库方式上传 4 个 feed JSON（官方/视频号主数据）
      - name: Upload feed JSONs to Tencent COS
        if: success()
        timeout-minutes: 15
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: vw-data-1311399697
          COS_REGION: ap-guangzhou
        run: |
          python3 - <<'PY'
          import os, time, hmac, hashlib, urllib.request, urllib.error
          SID=os.environ.get('COS_SECRET_ID',''); SKEY=os.environ.get('COS_SECRET_KEY','')
          BUCKET=os.environ.get('COS_BUCKET','vw-data-1311399697'); REGION=os.environ.get('COS_REGION','ap-guangzhou')
          HOST=f'{BUCKET}.cos.{REGION}.myqcloud.com'
          if not SID or not SKEY:
              print('COS secrets not set, skip'); raise SystemExit(0)
          def h(k,m): return hmac.new(k, m.encode('utf-8'), hashlib.sha256).digest()
          def put(key, local, ct='application/json; charset=utf-8'):
              body=open(local,'rb').read()
              t0=int(time.time()); kt=f'{t0};{t0+3000}'; dp=time.strftime('%Y-%m-%d', time.gmtime(t0))
              md5=hashlib.md5(body).hexdigest()
              canon='PUT/'+key+'/'+chr(10)+f'content-type:{ct};host:{HOST};'+chr(10)+'content-type;host'+chr(10)+md5
              sts='TC3-HMAC-SHA256'+chr(10)+kt+chr(10)+'/cos/'+dp+'/qcs'+chr(10)+hashlib.sha256(canon.encode()).hexdigest()
              k=h(SKEY.encode(),dp); k=h(k,'cos'); k=h(k,REGION); k=h(k,'qcs')
              sig=hmac.new(k,sts.encode(),hashlib.sha256).hexdigest()
              auth=f'TC3-HMAC-SHA256 Credential={SID}/{kt}/cos/{dp}/qcs, SignedHeaders=content-type;host, Signature={sig}'
              req=urllib.request.Request(f'https://{HOST}/{key}', data=body, method='PUT')
              req.add_header('Content-Type', ct); req.add_header('Host', HOST)
              req.add_header('X-TC-Action','PutObject'); req.add_header('X-TC-Timestamp',str(t0)); req.add_header('Authorization',auth)
              proxy=urllib.request.build_opener(urllib.request.ProxyHandler({}))
              for a in range(4):
                  try:
                      r=proxy.open(req, timeout=180); return r.status, ''
                  except urllib.error.HTTPError as e:
                      return e.code, e.read().decode('utf-8','replace')[:200]
                  except Exception as e:
                      if a==3: return -1, str(e)[:200]
                      time.sleep(2)
              return -1, 'retry-exhausted'
          for key in ['data/official-feed.json','data/look-feed.json','data/ai-review.json']:
              if not os.path.exists(key): print('skip (not found):',key); continue
              st, info = put(key, key)
              print(f'  {key}: HTTP {st}', info if st!=200 else '(ok)')
          PY
