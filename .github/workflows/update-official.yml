name: Update official feed

# 公众号 / 看一看 / AI 评论的云端抓取任务。
# 跑在 GitHub 服务器（Node + 无跨域限制 + cron 定时器），产出提交回本仓库，
# 由 GitHub Pages 直接对外提供 → APK 无需重新打包即可吃到最新数据。
on:
  schedule:
    # 每 2 小时跑一次，保证"有标题就有正文"不变式最多 2 小时闭环一次。
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 与本仓库其它 feed 任务共用一把锁，避免两条同时 push main 撞 non-fast-forward。
# cancel-in-progress: false → 新触发排队等待而不抢占，避免长时间 COS 上传被取消、清单丢失、整轮变红。
concurrency:
  group: shared-git-lock
  cancel-in-progress: false

jobs:
  update-official:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # content library 是持续累积池（本地已 75MB 且每轮都会变），
      # 提交进 git 会让仓库迅速膨胀 → 改用 Actions 缓存跨轮保留。
      # 缓存未命中时脚本会优雅降级为空池，不影响抓取結果。
      - name: Restore content library cache
        uses: actions/cache@v4
        with:
          path: data/library.json
          key: official-library-${{ github.run_id }}
          restore-keys: |
            official-library-

      - name: Generate official + look feed
        run: node scripts/update-official-feed.js

      # AI 评论：增量生成（已有评论的文章会跳过）。
      # 失败不拦路：生成失败/402/没 key 时只打 ::warning:: 注解（在运行页可见），本轮不动评论，
      # 后面的 strip / 上传 / 提交照常执行，避免“评论服务一出问题整条链路冻结、数据不更新”；下一轮增量自动补。
      - name: Generate AI comments (incremental)
        env:
          SF_KEY: ${{ secrets.SF_KEY }}
        run: node scripts/ai-comments.js --conc 4 || echo "::warning::AI 评论生成失败（密钥/额度/网络），本轮跳过，其余步骤照常，下一轮自动补"

      # 剥离正文为单篇小文件 data/articles/{id}.json（幂等）：
      # 保证 official-feed.json 里每一篇有标题的文章，都配一个可独立拉取的正文章节。
      # 同时记录本轮新生成/变更的 id 到 data/articles-changed.txt（浅克隆下 git diff HEAD~1 不可用，
      # 改用 strip 脚本顺带写入，COS 上传步骤读这个文件做增量）。
      - name: Strip article bodies into per-id files
        run: |
          python3 scripts/strip-content-to-articles.py
          # strip 脚本已按幂等方式把本轮所有 official-feed/look-feed 文章的 id 写到
          # data/articles-changed.txt（含新增 + 正文变更的）；若该文件不存在则用全量兜底
          if [ ! -f data/articles-changed.txt ]; then
            ls data/articles/ 2>/dev/null | grep -E '\.json$' > data/articles-changed.txt || true
          fi
          echo "changed ids: $(wc -l < data/articles-changed.txt)"

      # 审计：检查 official-feed 里是否存在"有标题但缺单篇"的文章（缺单篇则本步失败，拒绝发布到 COS）。
      - name: Audit per-article body coverage
        run: |
          python3 - <<'PY'
          import json,os
          feed=json.load(open('data/official-feed.json',encoding='utf-8'))
          art='data/articles'
          missing=[]
          for a in (feed.get('accounts') or []):
              for it in (a.get('articles') or []):
                  cid=it.get('id')
                  if cid and not os.path.exists(os.path.join(art,f'{cid}.json')):
                      missing.append(str(cid))
          open('data/articles-missing.txt','w').write('\n'.join(missing))
          print('official-feed articles:',sum(len(a.get('articles') or []) for a in (feed.get('accounts') or [])))
          print('missing per-id bodies:',len(missing))
          if missing:
              print('first 20:',missing[:20])
              raise SystemExit('missing per-id bodies; refuse COS publication')
          PY

      # 上传单篇到腾讯 COS：手机端 vwFetchJson 远程优先读 COS，
      # 这里必须把 data/articles/{id}.json 推上去，"有标题就有正文"才成立。
      # 真增量：strip 脚本只把「不在 data/articles-uploaded.json 或哈希变化」的 id 写进 articles-changed.txt，
      # 上传脚本按 ts 降序逐篇 PUT，仅 HTTP 200 后记入清单；25 分钟预算到点保存清单并正常退出，下一轮继续。
      - name: Upload per-id article bodies to Tencent COS
        if: success()
        timeout-minutes: 35
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: vw-data-1311399697
          COS_REGION: ap-guangzhou
          UPLOAD_BUDGET_MINUTES: '25'
        run: python3 scripts/upload-articles-to-cos.py

      # 主 JSON 只在单篇正文上传成功（含预算正常退出）后发布，避免标题与正文不一致。
      # ai-review.json 为可选：失败只 ::warning::，不让本步失败（保留 3c31470 意图）；official/look 任一失败则本步失败、末尾提交跳过。
      - name: Upload feed JSONs to Tencent COS
        if: success()
        timeout-minutes: 15
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: vw-data-1311399697
          COS_REGION: ap-guangzhou
          COS_FEED_FILES: official-feed.json,look-feed.json,ai-review.json
          COS_FEED_OPTIONAL: ai-review.json
        run: python3 scripts/upload-feeds-to-cos.py

      # COS 发布完成后才提交 Git 备份和上传清单。该步骤失败会使 workflow 失败，
      # 但不会回滚或阻断已发布的 COS 用户数据。
      - name: Commit published data and upload manifest
        continue-on-error: false
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update official/look feed + AI comments + article COS manifest'
          file_pattern: >-
            data/official-feed.json
            data/look-feed.json
            data/ai-review.json
            data/articles-history.json
            data/articles-missing.txt
            data/articles-uploaded.json
            data/articles/
