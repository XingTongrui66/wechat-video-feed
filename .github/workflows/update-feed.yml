name: Update feeds (continuous crawl + library)

on:
  # 每小时跑一次：持续抓取、把全文累积进 data/library.json 并刷新 data/official-feed.json。
  # GitHub 计划任务偶尔会延迟（高负载时可能几小时），对“不求时效、只要数量”无影响。
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    # 串行运行，避免并行轮次互相覆盖已累积的评论
    concurrency:
      group: update-feed
      cancel-in-progress: false
    env:
      # CI 上跳过 localhost 微信源（云端跑不到），其余 Web 源正常抓取
      GITHUB_ACTIONS: 'true'
      # 云端库容量上限：控制仓库体积（库已满会裁剪最旧的已展示文章）
      LIBRARY_MAX: '1500'
      # 每个账号单次展示篇数下限
      SERVE_KEEP: '12'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史以便提交增长后的 library.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate video feed
        timeout-minutes: 40
        env:
          # 增量累积评论：继承 checkout 出来的上一轮 data/channels-feed.json，每轮只给前 300 个无评论视频补抓
          COMMENT_BATCH: '300'
        run: node scripts/update-feed.js

      # 说明：公众号文章源已全部改为 新浪 + 网易 + 中新网 + 科技财经站，均不依赖 RSSHub
      # （新浪走 feed.sina.com.cn 实时接口，网易走自有 JSONP 接口），
      # 因此不再需要自建 RSSHub 容器，CI 更快也更稳。
      # 本步会：抓取 → 全量写入 data/library.json（按 URL 去重、标记已展示）→ 取未展示文章写 official-feed.json。
      - name: Generate official account feed (cumulative library)
        run: node scripts/update-official-feed.js

      # AI 评论：增量生成（跳过已存在的），写入 data/ai-review.json。
      # 需要仓库 Secrets 里配置 SF_KEY（SiliconFlow API Key）。
      # continue-on-error：未配置 key 时只跳过评论，不影响视频号/公众号抓取提交。
      - name: Generate AI comments
        continue-on-error: true
        env:
          SF_KEY: ${{ secrets.SF_KEY }}
        run: node scripts/ai-comments.js --conc 4

      - name: Commit updated feed + library + comments
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: crawl + update library + ai comments'
          file_pattern: data/channels-feed.json data/channels-history.json data/official-feed.json data/official-sources.json data/articles-history.json data/library.json data/ai-review.json data/look-feed.json

      # 剥离正文为单篇小文件（省 COS 流量）：Actions 用 python3 跑，生成 data/articles/
      - name: Strip article bodies into per-id files
        continue-on-error: true
        run: python3 scripts/strip-content-to-articles.py

      # 上传到腾讯云 COS：手机端唯一可读源（国内网络访问 GitHub 不通）。
      # 密钥从仓库 Secrets 读取，绝不明文写在仓库里。
      # 需先在 仓库 Settings → Secrets 配置：COS_SECRET_ID / COS_SECRET_KEY
      # 这样每小时抓取后自动把最新数据推到 COS，前端(手机)从 COS 拉到实时更新。
      - name: Upload latest data to Tencent COS
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: vw-data-1311399697
          COS_REGION: ap-guangzhou
        run: |
          # feed JSON 改用腾讯云 TC3 签名直传（与 update-official.yml 的「Upload feed JSONs」步骤一致），
          # 不再依赖 coscmd（pip 安装 + 二进制不稳定、曾超时失败）。
          # 注意：channels-feed.json 不再在此上传——B 站对 GitHub Actions 机房 IP 风控，云端永远抓不到
          # 视频号真实评论，只会把「只有 280/500 条」的残缺版本推到 COS，覆盖掉本机补抓好的 491/500。
          # 视频号数据完全由本机 scripts/fetch-channels-comments.js --push 维护。
          python3 - <<'PY'
          import os, time, hmac, hashlib, urllib.request, urllib.error
          SID=os.environ.get('COS_SECRET_ID',''); SKEY=os.environ.get('COS_SECRET_KEY','')
          BUCKET=os.environ.get('COS_BUCKET','vw-data-1311399697'); REGION=os.environ.get('COS_REGION','ap-guangzhou')
          HOST=f'{BUCKET}.cos.{REGION}.myqcloud.com'
          if not SID or not SKEY:
              print('COS secrets not set, skip'); raise SystemExit(0)
          def h(k,m): return hmac.new(k, m.encode('utf-8'), hashlib.sha256).digest()
          def put(key, local, ct='application/json; charset=utf-8'):
              body=open(local,'rb').read()
              t0=int(time.time()); kt=f'{t0};{t0+3000}'; dp=time.strftime('%Y-%m-%d', time.gmtime(t0))
              md5=hashlib.md5(body).hexdigest()
              canon='PUT/'+key+'/'+chr(10)+f'content-type:{ct};host:{HOST};'+chr(10)+'content-type;host'+chr(10)+md5
              sts='TC3-HMAC-SHA256'+chr(10)+kt+chr(10)+'/cos/'+dp+'/qcs'+chr(10)+hashlib.sha256(canon.encode()).hexdigest()
              k=h(SKEY.encode(),dp); k=h(k,'cos'); k=h(k,REGION); k=h(k,'qcs')
              sig=hmac.new(k,sts.encode(),hashlib.sha256).hexdigest()
              auth=f'TC3-HMAC-SHA256 Credential={SID}/{kt}/cos/{dp}/qcs, SignedHeaders=content-type;host, Signature={sig}'
              req=urllib.request.Request(f'https://{HOST}/{key}', data=body, method='PUT')
              req.add_header('Content-Type', ct); req.add_header('Host', HOST)
              req.add_header('X-TC-Action','PutObject'); req.add_header('X-TC-Timestamp',str(t0)); req.add_header('Authorization',auth)
              # CI 环境无代理，直连 COS API
              proxy=urllib.request.build_opener(urllib.request.ProxyHandler({}))
              for a in range(4):
                  try:
                      r=proxy.open(req, timeout=180); return r.status, ''
                  except urllib.error.HTTPError as e:
                      return e.code, e.read().decode('utf-8','replace')[:200]
                  except Exception as e:
                      if a==3: return -1, str(e)[:200]
                      time.sleep(2)
              return -1, 'retry-exhausted'
          fail=0
          # 评论文件可选：上传失败只告警，不计入 fail，避免 bash -e 中止后面的单篇正文上传
          OPTIONAL={'data/ai-review.json'}
          for key in ['data/official-feed.json','data/look-feed.json','data/ai-review.json']:
              if not os.path.exists(key):
                  print('skip (not found):', key); continue
              try: st, info = put(key, key)
              except Exception as e: st, info = -1, str(e)[:200]
              print(f'  {key}: HTTP {st}', info if st!=200 else '(ok)')
              if st!=200 and key in OPTIONAL:
                  print(f'::warning::{key} 本轮未上传到 COS（HTTP {st}），下轮重试；不影响正文和列表上传'); continue
              if st!=200: fail+=1
          if fail>0:
              print(f'[COS] {fail} feed upload(s) failed'); raise SystemExit(1)
          print('[COS] feed JSONs uploaded (TC3)')
          PY
          # 单篇正文仍走 coscmd -rs 递归增量（与 update-official.yml 一致：跳过已存在文件，避免全量重传超时）
          pip install -q coscmd
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION" -m 10
          if [ -d data/articles ]; then coscmd upload -rs data/articles data/articles; fi
