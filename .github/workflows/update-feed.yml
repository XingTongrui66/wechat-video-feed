name: Update feeds (continuous crawl + library)

on:
  # 每小时跑一次：持续抓取、把全文累积进 data/library.json 并刷新 data/official-feed.json。
  # GitHub 计划任务偶尔会延迟（高负载时可能几小时），对“不求时效、只要数量”无影响。
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    # 串行运行，避免并行轮次互相覆盖已累积的评论
    # group 改为 shared-git-lock：与 update-official.yml 共享同一把锁，
    # cancel-in-progress: true → 新触发直接抢占旧 run（旧的最多 15 分钟超时放行，不会无限排队）
    concurrency:
      group: shared-git-lock
      cancel-in-progress: true
    env:
      # CI 上跳过 localhost 微信源（云端跑不到），其余 Web 源正常抓取
      GITHUB_ACTIONS: 'true'
      # 云端库容量上限：控制仓库体积（库已满会裁剪最旧的已展示文章）
      LIBRARY_MAX: '1500'
      # 每个账号单次展示篇数下限
      SERVE_KEEP: '12'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史以便提交增长后的 library.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate video feed
        timeout-minutes: 40
        env:
          # 增量累积评论：继承 checkout 出来的上一轮 data/channels-feed.json，每轮只给前 300 个无评论视频补抓
          COMMENT_BATCH: '300'
        run: node scripts/update-feed.js

      # 说明：公众号文章源已全部改为 新浪 + 网易 + 中新网 + 科技财经站，均不依赖 RSSHub
      # （新浪走 feed.sina.com.cn 实时接口，网易走自有 JSONP 接口），
      # 因此不再需要自建 RSSHub 容器，CI 更快也更稳。
      # 本步会：抓取 → 全量写入 data/library.json（按 URL 去重、标记已展示）→ 取未展示文章写 official-feed.json。
      - name: Generate official account feed (cumulative library)
        run: node scripts/update-official-feed.js

      # AI 评论：增量生成（跳过已存在的），写入 data/ai-review.json。
      # 需要仓库 Secrets 里配置 SF_KEY（SiliconFlow API Key）。
      # 去掉 continue-on-error：生成失败/0 条/402/没 key 时直接让 CI 标 failure，避免"假 success 但 key 数不涨"。
      - name: Generate AI comments
        env:
          SF_KEY: ${{ secrets.SF_KEY }}
        run: node scripts/ai-comments.js --conc 4

      - name: Commit updated feed + library + comments
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: crawl + update library + ai comments'
          file_pattern: data/channels-feed.json data/channels-history.json data/official-feed.json data/official-sources.json data/articles-history.json data/library.json data/ai-review.json data/look-feed.json

      # 上传到腾讯云 COS：手机端唯一可读源（国内网络访问 GitHub 不通）。
      # 密钥从仓库 Secrets 读取，绝不明文写在仓库里。
      # 需先在 仓库 Settings → Secrets 配置：COS_SECRET_ID / COS_SECRET_KEY
      # 这样每小时抓取后自动把最新数据推到 COS，前端(手机)从 COS 拉到实时更新。
      # timeout-minutes: 15 → 上传卡死时 15 分钟自动放行，锁不会被无限占住。
      # 去掉 continue-on-error：上传失败/403/404 时让 CI 标 failure，避免"假 success 但 COS 没新数据"。
      # 增量上传：data/articles/ 只传本轮 git diff 里新增/变更的单篇（不再全量递归 1700 篇导致超时）；
      # 4 个 feed JSON 是单文件，全量上传（秒传）。
      - name: Upload latest data to Tencent COS
        timeout-minutes: 15
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: vw-data-1311399697
          COS_REGION: ap-guangzhou
        run: |
          pip install -q coscmd
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION" -m 10
          # 4 个主数据单文件：全量上传（每个几秒）
          coscmd upload data/official-feed.json data/official-feed.json
          coscmd upload data/look-feed.json data/look-feed.json
          coscmd upload data/channels-feed.json data/channels-feed.json
          coscmd upload data/ai-review.json data/ai-review.json
          # 单篇增量：只传本轮变更的 data/articles/*.json
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'data/articles/' 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            # 首轮/无 diff 时回退全量（仅首轮慢，后续走增量）
            echo "[COS] first run or no diff, full upload of data/articles"
            coscmd upload -r data/articles data/articles
          else
            echo "$CHANGED" | while read -r f; do
              case "$f" in
                data/articles/*.json)
                  coscmd upload "$f" "$f" || echo "[COS] upload fail: $f"
                  ;;
              esac
            done
            echo "[COS] incremental upload: $(echo "$CHANGED" | grep -c 'data/articles/.*\.json') changed per-id bodies"
          fi
